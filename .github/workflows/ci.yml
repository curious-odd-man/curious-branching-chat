name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end tests (Electron, test build with dialog stubs)
        run: npm run test:e2e
      - name: Release build
        run: npm run build
      - name: Package the Windows installer (unsigned)
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Installer smoke test (silent install, update, uninstall, file association rules)
        # Not yet proven on a real runner; make it blocking by removing continue-on-error once it has passed.
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BranchChat-installer
          path: |
            dist/BranchChat-Setup.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
