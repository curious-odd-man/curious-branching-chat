name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v7
      - uses: actions/checkout@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No known vulnerabilities in the runtime dependencies (code review section 9)
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: No circular imports (code review T-7; type-only imports are allowed)
        run: npm run check:cycles
      - name: No unused files, exports, or dependencies (code review T-5)
        run: npm run check:unused
      - name: Unit tests with a coverage report (code review T-4; no limit yet)
        run: npm run test:coverage
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: End-to-end tests (Electron, test build with dialog stubs)
        run: npm run test:e2e
      - name: Keep the results of failed end-to-end tests (error context, app logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Release build
        run: npm run build
      - name: Package the Windows installer (unsigned)
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Installer smoke test (silent install, update, uninstall, file association rules)
        # Not yet proven on a real runner; make it blocking by removing continue-on-error once it has passed.
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BranchChat-installer
          path: |
            dist/BranchChat-Setup.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
