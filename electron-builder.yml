# Windows installer configuration (ADR-001 section 4).
# Primary deliverable: one per-user NSIS installer, BranchChat-Setup.exe (no administrator rights).
appId: app.branchchat.desktop
productName: BranchChat
copyright: BranchChat
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
# Electron fuses: switch off what an installed application never needs (security review, phase 9).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - target: nsis
      arch: [x64]
  # Releases are unsigned in the MVP (NFR-016). No certificate settings on purpose.
  artifactName: BranchChat-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false # per-user install, no administrator rights
  allowElevation: false # never offer an "all users" install, which would need administrator rights
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  # The .branchchat file association is NOT configured through `fileAssociations` (that registers it silently).
  # build/installer.nsh asks for consent on its own page and writes the keys itself (FR-089, FR-090, FR-134, FR-135).
  include: build/installer.nsh
extraResources:
  - from: build/document.ico
    to: document.ico
  # the notification-area icon (release 1.4, src/main/background/electronPorts.ts)
  - from: build/icon.ico
    to: tray.ico
# Updates come from GitHub Releases (stable only). Set the real owner before the first release.
publish:
  - provider: github
    owner: curious-odd-man
    repo: curious-branching-chat
    releaseType: release
