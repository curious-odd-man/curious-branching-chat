# Windows installer configuration (ADR-001 section 4).
# Primary deliverable: one per-user NSIS installer, BranchChat-Setup.exe (no administrator rights).
appId: app.branchchat.desktop
productName: BranchChat
copyright: BranchChat
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  # Releases are unsigned in the MVP (NFR-016). No certificate settings on purpose.
  artifactName: BranchChat-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false # per-user install, no administrator rights
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  # Phase 7: replace automatic registration with an installer option that asks for consent (FR-090),
  # using `nsis.include` with a custom script.
fileAssociations:
  - ext: branchchat
    name: Обсуждение BranchChat
    description: Файл обсуждения BranchChat
    role: Editor
# Updates come from GitHub Releases (stable only). Set the real owner before the first release.
publish:
  - provider: github
    owner: YOUR_GITHUB_USER
    repo: branchchat
    releaseType: release
